<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>BAR SAT</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#16130f">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<style>
  html,body{margin:0;height:100%;background:#16130f;overflow:hidden}
  iframe{position:fixed;inset:0;width:100%;height:100%;border:0;display:block;background:#16130f}
  #net{position:fixed;left:0;right:0;top:0;z-index:2;display:none;padding:10px 14px;
       font:600 15px system-ui,sans-serif;color:#fff;background:#d7262b;text-align:center}
  #net.on{display:block}
</style>
</head>
<body>
<div id="net" role="alert">No signal. Sales will not go through until the phone is back online.</div>
<!-- Bartender Vs IP - SATURDAY 31/10/2026 app (not training, not Friday) -->
<iframe id="app" title="Bartender Vs IP Saturday"
  src="https://script.google.com/macros/s/AKfycbzEWxt5RkuriWdmX9PKguc-zaqS3ZqudF-O_7ZkqJUyD6wGkQqrVMSfANEscz-mFGMP/exec"
  allow="camera *; clipboard-write *; fullscreen *"></iframe>
<script>
  var n=document.getElementById('net');
  function s(){ n.className = navigator.onLine ? '' : 'on'; }
  addEventListener('online',s); addEventListener('offline',s); s();
  if('serviceWorker' in navigator){ navigator.serviceWorker.register('sw.js').catch(function(){}); }
</script>
</body>
</html>
